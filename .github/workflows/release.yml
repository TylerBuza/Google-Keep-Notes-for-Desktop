name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Private installer version (for example 2.2.0-private.1)'
        required: true
        default: '2.2.0-private.6'

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          pip install --require-hashes --only-binary=:all: -r requirements.lock
          pip install pyinstaller==6.22.3 pip-audit==2.10.1
          # Sanity check: every release has been broken at least once
          # by a silent pip failure. Verify the critical imports BEFORE
          # the build steps run.
          python -c "import PySide6, keyring, requests; print('deps ok')"

      - name: Audit installed Python build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Path Output -Force | Out-Null
          python -m pip_audit --local --format json --output Output/security-build-audit.json

      - name: Run test suite
        shell: pwsh
        # Tests must pass before we waste time building & publishing a
        # broken release. Fail the workflow loudly if anything regresses.
        env:
          # GitHub runners have no display; use Qt's offscreen platform
          # so QGuiApplication / QTextDocument can spin up headlessly.
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pytest tests/ -v

      - name: Determine version
        id: ver
        shell: pwsh
        env:
          BUILD_REF: ${{ github.ref_name }}
          PRIVATE_VERSION: ${{ inputs.version }}
        run: |
          $tag = $env:BUILD_REF
          if ($env:PRIVATE_VERSION) { $v = $env:PRIVATE_VERSION }
          elseif ($tag -match '^v(.+)$') { $v = $Matches[1] }
          else { throw 'Supply a private version when building from a branch.' }
          if ($v -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid build version.' }
          $numeric = ($v -split '-')[0]
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numeric=$numeric" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      - name: Stamp APP_VERSION into config.py
        # The Info dialog reads config.APP_VERSION at runtime; without
        # this step a forgotten manual bump ships an installer whose
        # filename says 2.1.0 but whose About box says 2.0.0.
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $path = "config.py"
          $content = Get-Content $path -Raw
          $new = [regex]::Replace($content, 'APP_VERSION\s*=\s*"[^"]*"', "APP_VERSION = `"$v`"")
          Set-Content -Path $path -Value $new -NoNewline
          Write-Host "Stamped APP_VERSION = $v"
          Select-String -Path $path -Pattern '^APP_VERSION'

      - name: Generate icon.ico
        shell: pwsh
        # Use the real Windows Qt platform plugin (not "offscreen") so the
        # font system has access to GDI fonts like Segoe UI. The offscreen
        # plugin ships with no fonts and renders text as empty glyphs.
        run: python tools/generate_icon.py

      - name: Build with PyInstaller
        shell: pwsh
        run: pyinstaller --noconfirm KeepDesktop.spec

      - name: Verify frozen authentication modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/verify_frozen_security.py build/KeepDesktop/Analysis-00.toc | Tee-Object -FilePath Output/security-frozen-inventory.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler was not installed.' }
          & $compiler.FullName `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            "/DMyAppNumericVersion=${{ steps.ver.outputs.numeric }}" `
            installer.iss

      - name: Write installer SHA256
        shell: pwsh
        run: |
          Get-ChildItem 'Output\KeepDesktop-Setup-*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Path ($_.FullName + '.sha256') -Encoding ascii
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepDesktop-Setup
          path: |
            Output\KeepDesktop-Setup-*.exe
            Output\KeepDesktop-Setup-*.exe.sha256
            Output\security-build-audit.json
            Output\security-frozen-inventory.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: KeepDesktop ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: Output\KeepDesktop-Setup-*.exe
